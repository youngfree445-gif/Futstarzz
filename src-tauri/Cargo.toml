[package]
name = "futstarzz"
version = "1.0.0"
description = "Fut Starzz 2026 - simulador de carrera futbolistica"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# El binario se compila con optimizacion de tamano: el juego corre entero en el WebView, asi que el
# ejecutable de Rust no hace calculo pesado y no gana nada con optimizar para velocidad. Lo que si
# se nota es el peso del instalador que el usuario descarga.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
